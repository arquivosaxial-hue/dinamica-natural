name: Publicar site

# Publica no GitHub Pages SÓ os arquivos do app.
# Lição do Trupe: publicar a pasta inteira expunha os scripts, os
# workflows e os SQL (que descrevem a segurança do banco). Aqui só
# vão para o ar os arquivos listados abaixo.
#
# Uma vez só: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Separar os arquivos do site
        run: |
          mkdir _site
          cp index.html sw.js manifest.json logo.jpg icon-*.png _site/
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
