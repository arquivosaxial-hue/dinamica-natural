name: Manter Supabase ativo

# O Supabase gratuito PAUSA o projeto depois de ~7 dias sem uso.
# Isto consulta o banco 2x por semana. Fica VERMELHO se falhar —
# assim a gente fica sabendo, em vez de descobrir com o app fora do ar.
#
# Precisa dos secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       ex.: https://abcd1234.supabase.co
#   SUPABASE_ANON_KEY  a Publishable key (sb_publishable_...)

on:
  schedule:
    - cron: '0 12 * * 1,4'   # segundas e quintas, 12h UTC (9h em Brasília)
  workflow_dispatch:          # botão "Run workflow" para testar na hora

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltam os secrets SUPABASE_URL e/ou SUPABASE_ANON_KEY."
            exit 1
          fi
          codigo=$(curl -s -o resposta.txt -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $codigo — $(cat resposta.txt)"
          if [ "$codigo" -ge 400 ]; then
            echo "::error::O Supabase não respondeu como esperado (HTTP $codigo)."
            exit 1
          fi
          echo "Supabase respondeu — projeto ativo."
